<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kharcha</title>
<meta name="theme-color" content="#0E7A5C">
<meta name="description" content="Personal expense, recharge, subscription and loan tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column phone ledger — month strip, summary, three tabs, floating add button with bottom sheet */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E6ECE8; --fg:#15201B; --muted:#5D6B64; --line:#D3DCD7;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --accent-soft:#D5EDE4;
  --bad:#B4421A; --bad-soft:#F7E1D7; --warn:#9A6A00; --warn-soft:#F5EACB; --good:#0E7A5C;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --fg:#E7EEEA; --muted:#93A39B; --line:#2C3833;
  --accent:#3FC79A; --accent-ink:#06120D; --accent-soft:#173A2E;
  --bad:#F08A62; --bad-soft:#3A2218; --warn:#E3B54A; --warn-soft:#352B12; --good:#3FC79A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#202A26; --fg:#E7EEEA; --muted:#93A39B; --line:#2C3833;
  --accent:#3FC79A; --accent-ink:#06120D; --accent-soft:#173A2E;
  --bad:#F08A62; --bad-soft:#3A2218; --warn:#E3B54A; --warn-soft:#352B12; --good:#3FC79A; color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0}
h1 span{color:var(--accent)}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px}
.monthnav button:hover{background:var(--sunk)}
.monthnav b{font-weight:600;min-width:84px;text-align:center;font-size:14px}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}

.hero{display:grid;gap:14px}
.spent-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spent{font-family:var(--mono);font-weight:600;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trio div{background:var(--surface);padding:10px 12px;min-width:0}
.trio small{display:block;font-size:12px;color:var(--muted)}
.trio .num{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{display:grid;gap:6px}
.track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.track.over i{background:var(--bad)}
.budget-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:13px;text-decoration:none}

.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.loan{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.loan-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.loan-top .t{min-width:0}.loan-top .t b{font-weight:600;display:block}.loan-top .t small{color:var(--muted);font-size:12px}
.loan-bal{text-align:right;flex:none}.loan-bal small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.loan-bal .num{font-size:18px;font-weight:600}
.loan-acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.loan-acts .toolsrow{align-items:center;gap:14px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

section{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:18px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.sub-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub-h span{font-size:13px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:0}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;width:100%;border:0;background:none;padding:5px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:10px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bar:hover,.bar:active{background:var(--sunk)}
.bar .lbl em::after{content:" ›";color:var(--muted)}
.bar .lbl{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.bar .num{font-size:13.5px}
.bar .lbl em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{grid-column:1/-1;height:4px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.bar .pct{color:var(--muted);font-size:11px;margin-left:4px;display:inline-block;min-width:30px;text-align:right}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mode .num{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;min-width:0}
.mode:hover,.mode:active{border-color:var(--muted)}
.mode small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.daily{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.daily-cols{display:flex;align-items:flex-end;gap:2px;height:96px}
.daily-cols i{flex:1;background:var(--accent);opacity:.85;border-radius:2px 2px 0 0;min-height:1px}
.daily-cols i.zero{background:var(--line);opacity:1}
.daily-cols i.today{opacity:1;outline:2px solid var(--fg);outline-offset:-2px}
.daily-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:14px}
.daygroup{display:flex;flex-direction:column;gap:2px}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px 2px 4px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.row:hover{border-color:var(--muted)}
.ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--display)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .amt{font-family:var(--mono);font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600;margin-left:4px}

.sub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sub .t b{font-weight:600}
.sub .t small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:4px}
.pill.due{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.sub .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.commit{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--accent-soft);gap:8px;align-items:center}
.commit small{display:block;color:var(--muted);font-size:12px}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--display);font-size:17px}
.toolsrow{display:flex;gap:8px;flex-wrap:wrap}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:20;display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:1}

.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);margin:0;font-size:20px;padding-right:48px}
.sheet-x{position:sticky;top:0;align-self:flex-end;margin-bottom:-50px;z-index:3;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font-size:22px;line-height:1;display:grid;place-items:center}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.seg.exp button[aria-pressed="true"]{color:var(--bad)}
.seg.inc button[aria-pressed="true"]{color:var(--good)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;font-size:15px}
.big-amt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.big-amt span{font-family:var(--mono);font-size:28px;color:var(--muted)}
.big-amt input{border:0;background:none;font-family:var(--mono);font-size:32px;font-weight:600;width:100%;padding:0;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-acts .right{display:flex;gap:8px;margin-left:auto}
.note{font-size:12px;color:var(--muted)}
.cloudbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.cloudbar span{min-width:0}.cloudbar .btn{flex:none}
.cloudbar.warn{background:var(--warn-soft)}.cloudbar.bad{background:var(--bad-soft)}
#cloudBar:empty{display:none}
.credit-toggle{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.credit-toggle input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.credit-toggle b{display:block;font-weight:600}.credit-toggle small{color:var(--muted);font-size:12px}
#lenderChips{margin-top:8px}
.danger-link{color:var(--bad)}
.modes.slots{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.slots .mode{padding:7px 6px;display:grid;gap:3px}.slots .mode small{font-size:10.5px}.slots .num{font-size:12.5px}
.slots .mode.top{border-color:var(--accent)}.slots .mode:disabled{opacity:.5;cursor:default}
.sbar{display:block;height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}.sbar b{display:block;height:100%;background:var(--accent)}
.note-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slothead{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;padding:6px 2px 2px}
.pace{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.pace small{display:block;font-size:12px;color:var(--muted)}
.pace-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.pace .big{font-size:22px;font-weight:600}
.pace-side{text-align:right}.pace-side .num{font-size:14px}
.pace-rows{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.pace-rows span{display:flex;justify-content:space-between;gap:10px}.pace-rows b{color:var(--fg);font-weight:600}
.pace-sm{gap:6px;padding:10px 12px}
.cpace{font-size:11px;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.chip.quick{background:var(--accent-soft);border-color:transparent;color:var(--fg);font-weight:600}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;padding:0 0 0 12px;font-size:14px}
.toast{display:flex;align-items:center;max-width:calc(100% - 32px);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.spent{font-size:34px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kharcha<span>.</span></h1>
    <div class="monthnav">
      <button id="prevM" aria-label="Previous month">‹</button>
      <b id="monthLbl">—</b>
      <button id="nextM" aria-label="Next month">›</button>
    </div>
  </header>

  <div class="hero">
    <div>
      <div class="spent-label">Spent this month</div>
      <div class="spent" id="spent">₹0</div>
    </div>
    <div class="trio">
      <div><small>Income</small><div class="num" id="income">₹0</div></div>
      <div><small>Net</small><div class="num" id="net">₹0</div></div>
      <div><small>Cash spent</small><div class="num" id="cashSpent">₹0</div></div>
    </div>
    <div class="budget" id="budgetBox"></div>
    <div class="status" id="status">Loading your ledger…</div>
    <div id="cloudBar"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-overview" aria-selected="true">Overview</button>
    <button role="tab" id="tab-entries" aria-selected="false">Entries</button>
    <button role="tab" id="tab-recurring" aria-selected="false">Renewals</button>
    <button role="tab" id="tab-loans" aria-selected="false">Loans</button>
  </div>

  <section id="v-overview"></section>
  <section id="v-entries" hidden></section>
  <section id="v-recurring" hidden></section>
  <section id="v-loans" hidden></section>
</div>

<button class="fab" id="fab"><span>+</span> Add</button>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";
/* ---------- reference data ---------- */
const EXP_CATS=[
 ["food","Food & Dining","#D9622B"],["smoke","Cigarettes","#8C6D5A"],["groceries","Groceries","#6E9F2D"],["recharge","Mobile Recharge","#2D7FD9"],
 ["internet","DTH / Broadband","#3E5FBF"],["subs","Subscriptions","#8A4FD1"],["utilities","Electricity & Water","#C9A100"],
 ["fuel","Fuel","#B03A48"],["transport","Transport","#1F9C9C"],["tip","Driver tip","#2B8C8C"],["rent","Rent","#5A6B78"],["salary_out","Salary paid","#3F7F6A"],["loan","Loan / EMI","#4B5D9A"],
 ["shopping","Shopping","#D14F8A"],["health","Health","#2E9E6A"],["education","Education","#7A6A2E"],
 ["entertain","Entertainment","#A15C2F"],["travel","Travel","#2F7A9E"],["work","Work / Office","#46607A"],
 ["family","Family & Gifts","#B5683C"],["other","Other","#7D8A84"]];
const INC_CATS=[["salary","Salary","#0E7A5C"],["client","Client payment","#2E8F6A"],["refund","Refund / Cashback","#4E9E86"],["loan_in","Loan repaid to me","#3E7F9E"],["inc_other","Other income","#6D9C8C"]];
const MODES=[["upi","UPI"],["cash","Cash"],["card","Card"],["bank","Bank / NEFT"],["wallet","Wallet"]];
const CYCLES=[["m1","Monthly"],["d28","28 days"],["d56","56 days"],["d84","84 days"],["q3","Quarterly"],["y1","Yearly"],["d7","Weekly"]];
const PRESETS=[["Staff salary","salary_out","m1"],["Jio prepaid","recharge","d28"],["Airtel prepaid","recharge","d28"],["Vi prepaid","recharge","d28"],
 ["Broadband","internet","m1"],["DTH","internet","m1"],["Netflix","subs","m1"],["Amazon Prime","subs","y1"],
 ["JioHotstar","subs","q3"],["Spotify","subs","m1"],["YouTube Premium","subs","m1"],["Google One","subs","y1"],
 ["Claude","subs","m1"],["Electricity bill","utilities","m1"],["FASTag","transport","m1"]];
const catMap={};[...EXP_CATS,...INC_CATS].forEach(c=>catMap[c[0]]={id:c[0],name:c[1],color:c[2]});
const MODES_ALL=MODES.concat([["credit","On credit"]]);
const SLOTS=[["morning","Morning"],["noon","Noon"],["afternoon","Afternoon"],["evening","Evening"],["night","Night"]];
const slotName=Object.fromEntries(SLOTS);
function slotOfHour(h){return h>=5&&h<11?"morning":h>=11&&h<14?"noon":h>=14&&h<17?"afternoon":h>=17&&h<21?"evening":"night"}
function currentSlot(){return slotOfHour(new Date().getHours())}
const SLOT_IDX={morning:0,noon:1,afternoon:2,evening:3,night:4};
function effSlot(t){if(t.slot)return t.slot;const c=Number(t.created);if(c>1e12){const d=new Date(c);if(iso(d)===t.date)return slotOfHour(d.getHours())}return ""}
const modeName=Object.fromEntries(MODES_ALL);const cycleName=Object.fromEntries(CYCLES);

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const inr=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0});
const inr2=new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2});
const fmt=n=>Math.abs(n)<1000&&n%1!==0?inr2.format(n):inr.format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function addMonths(d,n){const r=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
function advance(dateIso,cycle){const d=parse(dateIso);
  if(cycle==="m1")return iso(addMonths(d,1));if(cycle==="q3")return iso(addMonths(d,3));if(cycle==="y1")return iso(addMonths(d,12));
  const n=Number(cycle.slice(1))||30;d.setDate(d.getDate()+n);return iso(d)}
function perMonth(s){const a=Number(s.amount)||0;if(s.cycle==="m1")return a;if(s.cycle==="q3")return a/3;if(s.cycle==="y1")return a/12;return a*30.44/(Number(s.cycle.slice(1))||30)}
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function initials(name){return name.split(/[\s/&]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function toast(msg,undo){$("toastHost").innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="toastUndo">Undo</button>':'')+'</div>';

/* ---------- state ---------- */
const S={sortAsc:(()=>{try{return localStorage.getItem("kharcha-sortasc")==="1"}catch(e){return false}})(),items:[],cur:new Date(new Date().getFullYear(),new Date().getMonth(),1),tab:"overview",q:"",fMode:"",fCat:"",ready:false,mode:"local"};
let store=null;

/* ---------- storage: on this device ---------- */
function localStore(){
  const KEY="kharcha-v1";let items=[];
  try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){};markDirty()};
  let cb=()=>{};
  return{kind:"local",
    subscribe(f){cb=f;f(items.slice())},
    async add(d){d.id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);items.push(d);save();cb(items.slice())},
    async set(id,d){const i=items.findIndex(x=>x.id===id);const v=Object.assign({},d,{id});if(i<0)items.push(v);else items[i]=v;save();cb(items.slice())},
    async del(id){items=items.filter(x=>x.id!==id);save();cb(items.slice())},
    replace(list){items=list.map(x=>Object.assign({},x));save();cb(items.slice())}};
}
function attach(st){

/* ---------- reminders ---------- */
function dueList(days){const t=todayIso();const out=[];
  subs().forEach(s=>{const d=daysBetween(t,s.next);if(d<=days)out.push({key:"s:"+s.id+":"+s.next,title:s.name+" "+(d<0?"overdue":d===0?"due today":"due in "+d+"d"),body:fmt(s.amount)+" · "+cycleName[s.cycle],d})});
  loans().forEach(l=>{if(!l.next||loanStats(l).bal<=0)return;const d=daysBetween(t,l.next);if(d<=days)out.push({key:"l:"+l.id+":"+l.next,title:(l.dir==="lent"?"Repayment from ":"EMI · ")+l.name+" "+(d<0?"overdue":d===0?"due today":"due in "+d+"d"),body:(Number(l.emi)?fmt(l.emi)+" · ":"")+"Outstanding "+fmt(loanStats(l).bal),d})});
  return out.sort((a,b)=>a.d-b.d)}
function afterChange(){
  cloudOnChange();

  try{if("caches" in window){const up=[];const t=todayIso();
    subs().forEach(s=>up.push({key:"s:"+s.id+":"+s.next,date:s.next,title:s.name,body:fmt(s.amount)+" · "+cycleName[s.cycle]}));
    loans().forEach(l=>{if(l.next&&loanStats(l).bal>0)up.push({key:"l:"+l.id+":"+l.next,date:l.next,title:(l.dir==="lent"?"Repayment from ":"EMI · ")+l.name,body:Number(l.emi)?fmt(l.emi):""})});
    caches.open("kharcha-data").then(c=>c.put("./due.json",new Response(JSON.stringify(up),{headers:{"content-type":"application/json"}})))}}catch(e){}
  notifyDue();
}
async function notifyDue(){
  if(!("Notification" in window)||Notification.permission!=="granted"||!navigator.serviceWorker)return;
  let seen={};try{seen=JSON.parse(localStorage.getItem("kharcha-notified")||"{}")}catch(e){}
  const reg=await navigator.serviceWorker.ready.catch(()=>null);if(!reg)return;
  for(const x of dueList(1)){if(seen[x.key])continue;seen[x.key]=Date.now();
    try{await reg.showNotification(x.title,{body:x.body,tag:x.key,icon:"icons/icon-192.png",badge:"icons/badge-96.png"})}catch(e){}}
  try{localStorage.setItem("kharcha-notified",JSON.stringify(seen))}catch(e){}
}

}
function calLink(title,dateIso,cycle,details){

  const rr=cycle==="m1"?"RRULE:FREQ=MONTHLY":cycle==="q3"?"RRULE:FREQ=MONTHLY;INTERVAL=3":cycle==="y1"?"RRULE:FREQ=YEARLY":"RRULE:FREQ=DAILY;INTERVAL="+(Number(String(cycle).slice(1))||30);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+d+"/"+e+"&recur="+encodeURIComponent(rr)+"&details="+encodeURIComponent(details+"\n\nAdded from Kharcha")}

const FIXED_CATS=new Set(["rent","loan","subs","internet","utilities","salary_out","recharge","education"]);
function txKey(t){return [t.cat,t.amount,t.mode,(t.lender||"").toLowerCase(),(t.note||"").trim().toLowerCase()].join("|")}
function frequentItems(){
  const since=new Date();since.setDate(since.getDate()-60);const lim=iso(since);const g={};
  txns().forEach(t=>{if(t.type!=="expense"||t.example||t.loanId||t.subId||!t.date||t.date<lim)return;const k=txKey(t);
    const o=g[k]=g[k]||{t,n:0,last:""};o.n++;if(t.date>o.last||(t.date===o.last&&(t.created||0)>(o.t.created||0))){o.last=t.date;o.t=t}});
  return Object.values(g).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n||(a.last<b.last?1:-1)).slice(0,5).map(o=>o.t)}
function quickLabel(t){const m=catMap[t.cat]||catMap.other;return (t.note||m.name)+" · "+fmt(t.amount)+(t.mode==="credit"?" · credit":"")}
async function addCopy(t,date){

function monthPace(){ // current month only
  const now=new Date();if(monthKey(S.cur)!==monthKey(now))return null;
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),el=now.getDate();
  const exp=monthTx().filter(t=>t.type==="expense");
  const fixed=exp.filter(t=>FIXED_CATS.has(t.cat)).reduce((a,t)=>a+t.amount,0);
  const variable=exp.filter(t=>!FIXED_CATS.has(t.cat)).reduce((a,t)=>a+t.amount,0);
  const mStart=iso(new Date(now.getFullYear(),now.getMonth(),1)),mEnd=iso(new Date(now.getFullYear(),now.getMonth(),days));
  let upcoming=0;
  subs().forEach(s=>{if(s.next>=mStart&&s.next<=mEnd)upcoming+=Number(s.amount)||0});
  loans().forEach(l=>{if(l.dir!=="lent"&&l.next&&l.next>=mStart&&l.next<=mEnd&&loanStats(l).bal>0)upcoming+=Number(l.emi)||0});
  const varProj=el?variable/el*days:0;
  return{el,days,fixed,variable,upcoming,varPerDay:el?variable/el:0,proj:fixed+upcoming+varProj}}
function catPace(sum){const now=new Date();if(monthKey(S.cur)!==monthKey(now))return null;const el=now.getDate();if(el<5)return null;
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const m=sum/el*days;return{month:m,year:sum/el*365}}
const fmtK=n=>n>=100000?"₹"+(n/100000).toFixed(n<1000000?1:0).replace(/\.0$/,"")+"L":n>=1000?"₹"+(n/1000).toFixed(n<10000?1:0).replace(/\.0$/,"")+"k":fmt(Math.round(n));

function lenders(){const seen={};const out=[];
  S.items.filter(x=>x.lender&&((x.kind==="txn"&&x.mode==="credit")||x.kind==="settle"))
    .sort((a,b)=>(b.date||"")<(a.date||"")?-1:(b.date||"")>(a.date||"")?1:(b.created||0)-(a.created||0))
    .forEach(x=>{const k=x.lender.toLowerCase();if(!seen[k]){seen[k]=1;out.push(x.lender)}});return out}
function creditBook(){const m={};const get=n=>{const k=n.toLowerCase();return m[k]=m[k]||{name:n,bought:0,paid:0,n:0,last:""}};
  S.items.forEach(x=>{if(!x.lender)return;
    if(x.kind==="txn"&&x.mode==="credit"){const o=get(x.lender);o.bought+=x.amount;o.n++;if(x.date>o.last)o.last=x.date}
    else if(x.kind==="settle"){const o=get(x.lender);o.paid+=x.amount;if(x.date>o.last)o.last=x.date}});

/* ---------- loans ---------- */
function calcEmi(P,ratePa,n){P=Number(P);n=Number(n);const r=Number(ratePa)/1200;if(!(P>0&&n>0))return 0;if(!r)return P/n;return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)}
function loanStats(l){
  const pays=txns().filter(t=>t.loanId===l.id).sort((a,b)=>a.date<b.date?-1:1);
  const P=Number(l.principal)||0,r=(Number(l.rate)||0)/1200,emi=Number(l.emi)||0;
  let bal=P,paid=0;
  for(const p of pays){paid+=p.amount;bal=r?bal*(1+r)-p.amount:bal-p.amount}
  bal=Math.max(0,Math.round(bal));
  let left=0;if(bal>0&&emi>0){left=r?(r*bal<emi?Math.ceil(-Math.log(1-r*bal/emi)/Math.log(1+r)-0.05):Infinity):Math.ceil(bal/emi)}
  let ends=null;if(left&&isFinite(left)&&l.next){ends=parse(l.next);ends=addMonths(ends,left-1)}
  const interest=Math.max(0,paid-(P-bal));
  return{bal,paid,count:pays.length,left,ends,interest,pct:P?Math.min(100,(P-bal)/P*100):0};
}
function duePill(next){const dl=daysBetween(todayIso(),next);
  return dl<0?'<span class="pill due">Overdue by '+(-dl)+'d</span>':dl===0?'<span class="pill due">Due today</span>':dl<=5?'<span class="pill soon">Due in '+dl+'d</span>':'<span class="pill ok">Next '+parse(next).toLocaleDateString("en-IN",{day:"numeric",month:"short"})+'</span>'}
function loanCard(l){const st=loanStats(l);const lent=l.dir==="lent";const closed=st.bal<=0;
  const meta=[];if(Number(l.emi))meta.push((lent?"Expected ":"EMI ")+fmt(l.emi));if(Number(l.rate))meta.push(l.rate+"% p.a.");
  if(st.left)meta.push(isFinite(st.left)?st.left+" left":"EMI below interest");if(st.ends)meta.push("ends "+MONTHS[st.ends.getMonth()]+" "+st.ends.getFullYear());
  return '<div class="loan"><div class="loan-top"><div class="t"><b>'+esc(l.name)+(l.example?'<span class="tag">example</span>':'')+'</b><small>'+(lent?"You lent":"You owe")+' · '+meta.join(" · ")+'</small></div><div class="loan-bal"><small>'+(closed?"Closed":lent?"To receive":"Outstanding")+'</small><div class="num">'+fmt(st.bal)+'</div></div></div>'+
    '<div class="track"><i style="width:'+st.pct.toFixed(1)+'%"></i></div>'+
    '<div class="budget-row"><span>'+fmt(st.paid)+(lent?" received":" paid")+' in '+st.count+' payment'+(st.count===1?"":"s")+(st.interest?" · "+fmt(st.interest)+" interest":"")+'</span><span>'+Math.round(st.pct)+'%</span></div>'+
    '<div class="loan-acts"><div>'+(closed?'<span class="pill ok">Fully repaid</span>':l.next?duePill(l.next):'')+'</div><div class="toolsrow">'+(l.next&&!closed?'<a class="linkbtn" target="_blank" rel="noopener" href="'+esc(calLink((lent?"Repayment due · ":"EMI due · ")+l.name+(Number(l.emi)?" · "+fmt(l.emi):""),l.next,"m1",(lent?"Expected from ":"Pay to ")+l.name+(Number(l.emi)?"\nAmount: "+fmt(l.emi):"")))+'">Calendar</a>':'')+'<button class="linkbtn" data-editloan="'+esc(l.id)+'">Edit</button>'+(closed?'':'<button class="btn primary" data-payloan="'+esc(l.id)+'">'+(lent?"Record received":"Pay EMI")+'</button>')+'</div></div></div>'}
function renderLoans(){
  const el=$("v-loans");const list=loans();
  const owe=list.filter(l=>l.dir!=="lent"),lent=list.filter(l=>l.dir==="lent");

  // by mode

  h+='<h2>How you paid</h2><div class="modes">'+MODES_ALL.filter(m=>byMode[m[0]]).map(m=>'<button class="mode" data-fmode="'+m[0]+'" aria-label="Show '+m[1]+' entries"><small>'+m[1]+' ›</small><div class="num">'+fmt(byMode[m[0]])+'</div></button>').join("")+'</div>';
  { const bySlot={};let timed=0;exp.forEach(t=>{if(t.slot){bySlot[t.slot]=(bySlot[t.slot]||0)+t.amount;timed+=t.amount}});

function renderEntries(mt){

    .sort((a,b)=>{const dir=S.sortAsc?1:-1;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,saltB64,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(saltB64),iterations:iter||KDF_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])}
async function encryptItems(items){const key=await crypto.subtle.importKey("raw",unb64(C.cfg.key),{name:"AES-GCM"},false,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify({app:"kharcha",version:1,items})));
  return JSON.stringify({app:"kharcha",format:"kharcha-enc-1",kdf:"PBKDF2-SHA256",iter:KDF_ITER,salt:C.cfg.salt,iv:b64(iv),created:new Date().toISOString(),count:items.length,data:b64(ct)})}
async function decryptFile(obj,pass){const key=await deriveKey(pass,obj.salt,obj.iter);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(obj.iv)},key,unb64(obj.data));
  const d=JSON.parse(new TextDecoder().decode(pt));if(!d||!Array.isArray(d.items))throw new Error("bad");
  return{items:d.items,raw:b64(await crypto.subtle.exportKey("raw",key))}}

/* Google sign-in: full-page redirect, which works reliably inside an installed Android app */
function hasToken(){return !!C.token&&C.exp>Date.now()+60000}
function redirectUri(){if(location.host==="adscreativespace.github.io")return "https://adscreativespace.github.io/kharcha/";let p=location.pathname.replace(/index\.html$/,"");if(!p.endsWith("/"))p+="/";return location.origin+p}

  if(!GOOGLE_CLIENT_ID){toast("Drive backup isn't configured yet");return}
  if(!navigator.onLine){toast("You're offline. Connect to the internet to use Drive backup.");return}
  const st=b64(crypto.getRandomValues(new Uint8Array(12))).replace(/[^a-z0-9]/gi,"");
  lsSet("kharcha-auth",JSON.stringify({state:st,next,at:Date.now()}));
  const p=new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:redirectUri(),response_type:"token",scope:DRIVE_SCOPE,include_granted_scopes:"true",state:st,login_hint:GOOGLE_ACCOUNT});
  location.href="https://accounts.google.com/o/oauth2/v2/auth?"+p.toString();

function handleAuthReturn(){
  const h=location.hash.slice(1);if(!/(^|&)(access_token|error)=/.test(h))return null;
  const p=new URLSearchParams(h);let saved=null;try{saved=JSON.parse(lsGet("kharcha-auth")||"null")}catch(e){}
  lsSet("kharcha-auth",null);history.replaceState(null,"",location.pathname);
  if(!saved||p.get("state")!==saved.state){C.err="Google sign-in couldn't be verified. Try again.";return null}
  if(p.get("error")){C.err=p.get("error")==="access_denied"?"Google sign-in was cancelled.":"Google sign-in failed ("+p.get("error")+").";return null}
  if(!(p.get("scope")||"").includes("drive.appdata")){C.err="Kharcha needs permission for its Drive folder. Tap again and allow access.";return null}
  C.token=p.get("access_token");C.exp=Date.now()+(Number(p.get("expires_in"))||3600)*1000;
  lsSet("kharcha-cloud-token",JSON.stringify({token:C.token,exp:C.exp}));
  return saved.next||null;
}
async function gd(url,opt){opt=opt||{};
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+C.token},opt.headers||{})}));
  if(r.status===401){C.token=null;C.exp=0;lsSet("kharcha-cloud-token",null);const e=new Error("Google sign-in expired. Tap Back up to sign in again.");e.auth=true;throw e}
  if(!r.ok)throw new Error("Google Drive returned an error ("+r.status+"). Try again later.");
  return r}
async function driveList(){const r=await gd("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=modifiedTime%20desc&pageSize=100&fields=files(id,name,modifiedTime,size)");
  return ((await r.json()).files||[]).filter(f=>/^kharcha-.*\.enc$/.test(f.name))}
async function drivePut(name,body,files){const f=files.find(x=>x.name===name);
  if(f){await gd("https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(f.id)+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body});return}
  const bd="kharcha"+Date.now().toString(36);
  const mp="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,parents:["appDataFolder"],mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
  await gd("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp})}
async function driveGet(id){const r=await gd("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?alt=media");return r.json()}

async function cloudBackup(manual){
  if(!C.cfg||!C.cfg.key||C.busy||!hasToken())return false;
  const items=S.items.slice();
  if(!manual&&(C.cfg.lastCount||0)>10&&items.length<C.cfg.lastCount*0.5){C.warn=true;render();return false}
  C.busy=true;C.err="";render();
  try{const body=await encryptItems(items);const files=await driveList();
    await drivePut(MAIN_FILE,body,files);
    await drivePut("kharcha-"+todayIso().slice(0,7)+".enc",body,files);
    C.cfg.last=Date.now();C.cfg.lastCount=items.length;C.cfg.connected=true;cfgSave();C.warn=false;return true}
  catch(e){C.err=e.message||"Backup failed. Try again.";return false}
  finally{C.busy=false;render()}}
function cloudOnChange(){if(!C.cfg||!C.cfg.connected)return;clearTimeout(C.timer);
  C.timer=setTimeout(()=>{if(hasToken()&&dirtyTs()>(C.cfg.last||0))cloudBackup(false)},4000)}
function cloudDue(){return !!(C.cfg&&C.cfg.connected&&dirtyTs()>(C.cfg.last||0)&&!hasToken()&&Date.now()-(C.cfg.last||0)>20*3600e3)}
function backupNow(){if(hasToken())cloudBackup(true).then(ok=>ok&&toast("Backed up to Google Drive"));else signIn("backup")}

function cloudBar(){
  if(!GOOGLE_CLIENT_ID||!S.ready)return "";
  const bar=(txt,btn,tone)=>'<div class="cloudbar'+(tone?" "+tone:"")+'"><span>'+txt+'</span>'+(btn||"")+'</div>';
  if(C.busy)return bar("Backing up to Google Drive…");
  if(C.warn)return bar("Many entries were deleted since the last backup, so automatic backup is paused to protect your Drive copy.",'<button class="btn" data-act="cloud-now">Back up anyway</button>',"warn");
  if(C.err)return bar(esc(C.err),'<button class="btn" data-act="cloud-now">Try again</button>',"bad");
  if(cloudDue())return bar("Changes since "+ago(C.cfg.last)+" aren't in Drive yet.",'<button class="btn primary" data-act="cloud-now">Back up</button>');
  if(!C.cfg&&txns().filter(t=>!t.example).length>=5)return bar("Protect your entries with automatic Google Drive backup.",'<button class="btn primary" data-act="cloud-setup">Set up</button>');
  return "";
}
function cloudCard(){
  if(!GOOGLE_CLIENT_ID)return '<div class="commit"><div><small>Google Drive backup</small><b>Waiting for Google setup</b></div></div>';
  if(!C.cfg)return '<div class="commit"><div><small>Google Drive backup · encrypted</small><b>Automatic backup to '+esc(GOOGLE_ACCOUNT)+'</b></div><button class="btn primary" data-act="cloud-setup">Set up</button></div>'+
    '<div class="toolsrow"><button class="btn" data-act="cloud-restore">Restore from Drive</button></div>';
  if(!C.cfg.connected)return '<div class="commit"><div><small>Google Drive backup</small><b>Passphrase set. Sign in to finish.</b></div><button class="btn primary" data-act="cloud-connect">Connect</button></div>'+
    '<div class="toolsrow"><button class="btn" data-act="cloud-off">Change passphrase</button></div>';
  return '<div class="commit"><div><small>Google Drive backup · encrypted</small><b>Last backup '+ago(C.cfg.last)+(C.cfg.lastCount?" · "+C.cfg.lastCount+" records":"")+'</b></div><button class="btn primary" data-act="cloud-now"'+(C.busy?" disabled":"")+'>Back up now</button></div>'+
    '<div class="toolsrow"><button class="btn" data-act="cloud-restore">Restore from Drive</button><button class="btn danger" data-act="cloud-off">Turn off</button></div>';
}

function cloudSetupSheet(){
  openSheet('<form id="cs"><div style="display:flex;flex-direction:column;gap:14px"><h3>Google Drive backup</h3>'+
    '<span class="note">Kharcha encrypts your entries on this phone with your passphrase, then saves them to a hidden Kharcha folder in '+esc(GOOGLE_ACCOUNT)+'\'s Drive. Google can\'t read them. Backups run automatically after changes; at most once a day you may need to tap to sign in again.</span>'+
    '<div class="field"><label for="cp1">Choose a passphrase</label><input id="cp1" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div>'+
    '<div class="field"><label for="cp2">Type it again</label><input id="cp2" type="password" autocomplete="new-password"></div>'+
    '<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="cck" style="width:18px;height:18px;flex:none;margin-top:2px"> I\'ve saved this passphrase somewhere safe. If I forget it, my backups can\'t be opened by anyone.</label>'+
    '<div class="note" id="cErr" role="alert" style="color:var(--bad)"></div>'+
    '<div class="sheet-acts"><div class="right"><button type="button" class="btn" id="ccl">Cancel</button><button class="btn primary" id="cgo">Continue to Google</button></div></div></div></form>',()=>{
    $("ccl").onclick=closeSheet;
    $("cs").onsubmit=async e=>{e.preventDefault();const p1=$("cp1").value,p2=$("cp2").value;const err=t=>{$("cErr").textContent=t};
      if(p1.length<8)return err("Use at least 8 characters.");
      if(p1!==p2)return err("The two passphrases don't match.");
      if(!$("cck").checked)return err("Tick the box once you've saved the passphrase.");
      $("cgo").disabled=true;$("cgo").textContent="Preparing…";
      try{const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const key=await deriveKey(p1,salt,KDF_ITER);
        C.cfg={salt,key:b64(await crypto.subtle.exportKey("raw",key)),last:0,lastCount:0,connected:false};cfgSave();
        if(hasToken()){closeSheet();afterSignIn("setup")}else signIn("setup")}
      catch(x){err("This phone's browser couldn't set up encryption.");$("cgo").disabled=false;$("cgo").textContent="Continue to Google"}};
  });
}
async function afterSignIn(next){
  if(next==="backup"){const ok=await cloudBackup(true);if(ok)toast("Backed up to Google Drive");return}
  if(next==="restore"){cloudRestoreSheet();return}
  if(next==="setup"){
    try{const files=await driveList();const main=files.find(f=>f.name===MAIN_FILE);
      if(main&&C.cfg&&!C.cfg.connected){
        openSheet('<div style="display:flex;flex-direction:column;gap:14px"><h3>A backup already exists</h3><span>Drive already has a Kharcha backup from '+new Date(main.modifiedTime).toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"})+'.</span><span class="note">Restore it to bring those entries to this phone, or replace it with what\'s on this phone now ('+S.items.length+' records). Older monthly copies stay in Drive either way.</span><div class="sheet-acts"><div class="right" style="flex-wrap:wrap"><button class="btn" id="xr">Restore it</button><button class="btn danger" id="xo">Replace with this phone</button></div></div></div>',()=>{
          $("xr").onclick=()=>{C.cfg=null;cfgSave();closeSheet();cloudRestoreSheet()};
          $("xo").onclick=async()=>{closeSheet();C.cfg.connected=true;cfgSave();const ok=await cloudBackup(true);toast(ok?"Backup turned on":"Connected. The first backup didn't finish.")}});
        return}
      C.cfg.connected=true;cfgSave();const ok=await cloudBackup(true);toast(ok?"Backup turned on":"Connected. The first backup didn't finish.")}
    catch(e){C.err=e.message;render()}}
}
async function cloudRestoreSheet(){
  if(!hasToken()){signIn("restore");return}
  let files;try{files=await driveList()}catch(e){toast(e.message);return}
  if(!files.length){toast("No Kharcha backup found in "+GOOGLE_ACCOUNT+"'s Drive");return}
  const label=f=>f.name===MAIN_FILE?"Latest backup":"Monthly copy · "+(()=>{const m=f.name.match(/(\d{4})-(\d{2})/);return m?MONTHS[Number(m[2])-1]+" "+m[1]:f.name})();
  const when=f=>new Date(f.modifiedTime).toLocaleString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
  files.sort((a,b)=>a.name===MAIN_FILE?-1:b.name===MAIN_FILE?1:a.modifiedTime<b.modifiedTime?1:-1);
  openSheet('<form id="rs"><div style="display:flex;flex-direction:column;gap:14px"><h3>Restore from Google Drive</h3>'+
    '<div class="field"><label>Choose a backup</label><div style="display:flex;flex-direction:column;gap:6px">'+files.map((f,i)=>'<label class="row" style="grid-template-columns:auto minmax(0,1fr);cursor:pointer"><input type="radio" name="rf" value="'+esc(f.id)+'"'+(i?"":" checked")+'><span class="t"><b>'+esc(label(f))+'</b><small>Saved '+esc(when(f))+'</small></span></label>').join("")+'</div></div>'+
    '<div class="field"><label for="rp">Backup passphrase</label><input id="rp" type="password" autocomplete="current-password"></div>'+
    '<div class="note" id="rErr" role="alert" style="color:var(--bad)"></div>'+
    '<div class="sheet-acts"><div class="right"><button type="button" class="btn" id="rcl">Cancel</button><button class="btn primary" id="rgo">Open backup</button></div></div></div></form>',()=>{
    $("rcl").onclick=closeSheet;
    $("rs").onsubmit=async e=>{e.preventDefault();const id=($("rs").querySelector("input[name=rf]:checked")||{}).value;const pass=$("rp").value;
      if(!pass){$("rErr").textContent="Enter the passphrase you chose when you set up backup.";return}
      $("rgo").disabled=true;$("rgo").textContent="Opening…";
      try{const obj=await driveGet(id);let res;
        try{res=await decryptFile(obj,pass)}catch(x){throw new Error("Wrong passphrase, or the backup file is damaged.")}
        const n=res.items.length;
        $("rs").innerHTML='<div style="display:flex;flex-direction:column;gap:14px"><h3>Replace entries on this phone?</h3><span>The backup has <b>'+n+'</b> records. This phone has <b>'+S.items.length+'</b>, and they will be replaced.</span><div class="sheet-acts"><div class="right"><button type="button" class="btn" id="rc2">Cancel</button><button type="button" class="btn primary" id="rok">Replace and restore</button></div></div></div>';
        $("rc2").onclick=closeSheet;
        $("rok").onclick=()=>{store.replace(res.items);C.cfg={salt:obj.salt,key:res.raw,last:Date.now()+1000,lastCount:n,connected:true};cfgSave();C.err="";C.warn=false;closeSheet();toast("Restored "+n+" records");render()};
      }catch(x){$("rErr").textContent=x.message;$("rgo").disabled=false;$("rgo").textContent="Open backup"}};
  });
}
function cloudOff(btn){const pending=C.cfg&&!C.cfg.connected;
  if(pending){C.cfg=null;cfgSave();C.err="";render();cloudSetupSheet();return}
  if(btn.dataset.c!=="1"){btn.dataset.c="1";btn.textContent="Tap again to turn off";return}
  C.cfg=null;cfgSave();C.token=null;C.exp=0;lsSet("kharcha-cloud-token",null);C.err="";C.warn=false;toast("Drive backup turned off. Existing backups stay in Drive.");render()}

/* ---------- events ---------- */
$("prevM").onclick=()=>{S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()-1,1);render()};
$("nextM").onclick=()=>{S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()+1,1);render()};
TABS.forEach(t=>$("tab-"+t).onclick=()=>{S.tab=t;if(t!=="overview")ensureGuard();render()});
$("fab").onclick=()=>{if(!store)return;S.tab==="recurring"?subSheet():S.tab==="loans"?loanSheet():txSheet()};
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act],[data-edit],[data-editsub],[data-pay],[data-payloan],[data-editloan],[data-credpay],[data-credhist],[data-goto],[data-undosettle],[data-fcat],[data-fmode],[data-fslot]");if(!a||!store)return;
  if(a.dataset.fslot){S.fTime=a.dataset.fslot;S.fCat="";S.fMode="";S.q="";S.tab="entries";render();window.scrollTo(0,0);return}
  if(a.dataset.fcat||a.dataset.fmode){S.fCat=a.dataset.fcat||"";S.fMode=a.dataset.fmode||"";S.fTime="";S.q="";S.tab="entries";render();window.scrollTo(0,0);return}
  if(a.dataset.act==="sortdir"){S.sortAsc=!S.sortAsc;try{localStorage.setItem("kharcha-sortasc",S.sortAsc?"1":"")}catch(e){}render();return}
  if(a.dataset.act==="togglecats"){S.allCats=!S.allCats;render();return}
  if(a.dataset.act==="clearfilters"){S.fCat="";S.fMode="";S.fTime="";S.q="";render();return}
  if(a.dataset.credpay){settleSheet(a.dataset.credpay);return}
  if(a.dataset.credhist){creditHistorySheet(a.dataset.credhist);return}
  if(a.dataset.goto){S.tab=a.dataset.goto;render();window.scrollTo(0,0);return}
  if(a.dataset.undosettle){if(a.dataset.c!=="1"){a.dataset.c="1";a.textContent="Tap to confirm";return}const x=S.items.find(i=>i.id===a.dataset.undosettle);store.del(a.dataset.undosettle).then(()=>{toast("Payment removed");if(x)creditHistorySheet(x.lender)});return}
  if(a.dataset.payloan){const l=loans().find(x=>x.id===a.dataset.payloan);l&&payLoanSheet(l);return}
  if(a.dataset.editloan){const l=loans().find(x=>x.id===a.dataset.editloan);l&&loanSheet(Object.assign({},l));return}
  if(a.dataset.act==="newloan"){loanSheet();return}
  if(a.dataset.edit){const t=txns().find(x=>x.id===a.dataset.edit);t&&txSheet(Object.assign({},t))}
  else if(a.dataset.editsub){const s=subs().find(x=>x.id===a.dataset.editsub);s&&subSheet(Object.assign({},s))}
  else if(a.dataset.pay){a.disabled=true;markPaid(a.dataset.pay)}
  else{const k=a.dataset.act;if(k==="budget")budgetSheet();else if(k==="examples"){a.disabled=true;addExamples()}else if(k==="clearex"){a.disabled=true;clearExamples()}else if(k==="newsub")subSheet();else if(k==="csv")exportCsv();else if(k==="backup")backup();else if(k==="restore")restore();else if(k==="alerts")enableAlerts();else if(k==="cloud-setup")cloudSetupSheet();else if(k==="cloud-connect")signIn("setup");else if(k==="cloud-now"){C.warn=false;C.err="";backupNow()}else if(k==="cloud-restore")cloudRestoreSheet();else if(k==="cloud-off")cloudOff(a);else if(k==="install"&&S.installEvt){S.installEvt.prompt();S.installEvt.userChoice.finally(()=>{S.installEvt=null;render()})}}
});
boot();
})();
</script>
